name: Build & Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app_cloudfare/**'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Queens APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required by Android build tools)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Flutter pub get
        working-directory: app_cloudfare
        run: flutter pub get

      # 5. Analyze (optional — remove if too strict)
      - name: Flutter analyze
        working-directory: app_cloudfare
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 6. Build release APK
      - name: Build release APK
        working-directory: app_cloudfare
        run: flutter build apk --release

      # 7. Upload APK as artifact (downloadable from Actions tab)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: queens-release-${{ github.sha }}
          path: app_cloudfare/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 8. (Optional) Create a GitHub Release on version tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app_cloudfare/build/app/outputs/flutter-apk/app-release.apk
          name: Queens ${{ github.ref_name }}
          body: |
            ## Queens Game - Mobile APK
            Descarga `app-release.apk` e instálala en tu Android.
            > Activa "Orígenes desconocidos" en Ajustes → Seguridad antes de instalar.

